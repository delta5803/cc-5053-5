<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加法谐波重建乐器</title>
<style>
  :root { --bg:#14171c; --panel:#1d2229; --line:#2c333d; --fg:#e6e9ed; --muted:#8b95a1;
          --accent:#5aa7ff; --warn:#e0a13c; --bad:#e05c5c; --ok:#5cc98a; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 -apple-system,Segoe UI,Roboto,"Helvetica Neue",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .meta { color:var(--muted); }
  main { display:grid; grid-template-columns:minmax(420px,1.25fr) minmax(360px,1fr); gap:16px; padding:16px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:11px; }
  td input[type=number] { width:74px; background:#101418; border:1px solid var(--line); color:var(--fg);
                          border-radius:6px; padding:3px 5px; font:inherit; }
  td input[type=range] { width:110px; vertical-align:middle; }
  tr.soloed { background:rgba(90,167,255,.12); }
  tr.dropped td { color:var(--bad); }
  tr.attenuated td { color:var(--warn); }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.kept { background:rgba(92,201,138,.16); color:var(--ok); }
  .badge.attenuated { background:rgba(224,161,60,.16); color:var(--warn); }
  .badge.dropped { background:rgba(224,92,92,.16); color:var(--bad); }
  button { background:#262d36; color:var(--fg); border:1px solid var(--line); border-radius:7px;
           padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1622; font-weight:600; }
  button.active { background:var(--accent); border-color:var(--accent); color:#0b1622; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .row label { color:var(--muted); }
  .row input[type=range] { width:160px; }
  canvas { width:100%; height:170px; background:#101418; border-radius:8px; border:1px solid var(--line); }
  #wave { height:120px; }
  .muted { color:var(--muted); }
  .measure { font-variant-numeric:tabular-nums; }
  .measure td.ok { color:var(--ok); }
  .measure td.fail { color:var(--bad); }
  .scroll { max-height:430px; overflow:auto; }
  .filerow { display:flex; gap:8px; }
  .filerow input[type=file] { color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  #status { color:var(--muted); min-height:18px; }
</style>
</head>
<body>
<header>
  <h1>加法谐波重建乐器</h1>
  <span class="meta" id="meta"></span>
  <span id="status"></span>
</header>
<main>
  <section class="panel">
    <h2>分音（每个都是独立真实振荡器）</h2>
    <div class="row">
      <button id="soloClear" class="active">整体</button>
      <span class="muted">点击行内「独听」只听该分音；再点「整体」恢复求和</span>
    </div>
    <div class="scroll">
      <table id="partialTable">
        <thead><tr>
          <th>#</th><th>频率比</th><th>幅度</th><th>初相位(rad)</th>
          <th>起音(s)</th><th>衰减τ(s)</th><th>释放(s)</th><th>带限</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>演奏 / 导出 / 测量</h2>
    <div class="row">
      <label>总幅度 <input type="range" id="master" min="0" max="1" step="0.01"></label>
      <span class="measure" id="masterVal"></span>
    </div>
    <div class="row">
      <label>过渡时间 <input type="range" id="transition" min="0" max="0.2" step="0.001"></label>
      <span class="measure" id="transitionVal"></span>
    </div>
    <div class="row">
      <label>带限策略
        <select id="bandlimitMode">
          <option value="drop">drop（剔除）</option>
          <option value="attenuate">attenuate（带限衰减）</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="noteOn" class="primary">按下音符</button>
      <button id="noteOff">释放</button>
      <label>音高倍率 <input type="number" id="mult" value="1" min="0.25" max="4" step="0.01" style="width:80px"></label>
    </div>
    <div class="row">
      <button id="render">离线渲染并测量</button>
      <button id="exportWav">导出 WAV</button>
      <label>时长 <input type="number" id="duration" value="1.5" min="0.1" max="10" step="0.1" style="width:70px"> s</label>
    </div>
    <div class="row filerow">
      <label class="muted">配置</label>
      <input type="file" id="loadFile" accept=".json,application/json">
      <button id="saveConfig">保存配置 JSON</button>
    </div>
    <p class="hint">实时播放由浏览器 Web Audio 播放引擎离线弹跳的 PCM；所有采样均来自后端加法振荡器求和，
      不是均衡器改造的现成音源。</p>

    <h2 style="margin-top:16px">波形（前 0.05 秒，可见初相位）</h2>
    <canvas id="wave"></canvas>
    <h2 style="margin-top:14px">频谱（对渲染音频实测）</h2>
    <canvas id="spectrum"></canvas>
    <div class="scroll" style="max-height:220px;margin-top:10px">
      <table class="measure" id="measureTable">
        <thead><tr><th>分音</th><th>目标频率</th><th>实测频率</th><th>实测幅度</th><th>实测相位</th><th>判定</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let audioCtx = null;
let liveSource = null;

async function api(path, body) {
  const opt = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const res = await fetch(path, opt);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function setStatus(msg, isErr=false) {
  const el = $('status'); el.textContent = msg; el.style.color = isErr ? 'var(--bad)' : 'var(--muted)';
}

function renderTable() {
  const tbody = $('partialTable').querySelector('tbody');
  tbody.innerHTML = '';
  state.config.partials.forEach((p, i) => {
    const bl = state.bandlimit[i];
    const tr = document.createElement('tr');
    tr.className = `${bl.action}${state.solo_index === i ? ' soloed' : ''}`;
    const decayVal = p.decay === 'inf' ? 'inf' : p.decay.toFixed(3);
    tr.innerHTML = `
      <td>${i}</td>
      <td><input type="number" step="0.01" value="${p.ratio}" data-k="ratio"></td>
      <td><input type="range" min="0" max="1" step="0.005" value="${p.amplitude}" data-k="amplitude">
          <span class="measure">${p.amplitude.toFixed(3)}</span></td>
      <td><input type="number" step="0.01" value="${p.phase.toFixed(3)}" data-k="phase"></td>
      <td><input type="number" step="0.001" min="0" value="${p.attack}" data-k="attack"></td>
      <td><input type="number" step="0.01" min="0" value="${decayVal}" data-k="decay"></td>
      <td><input type="number" step="0.001" min="0" value="${p.release}" data-k="release"></td>
      <td><span class="badge ${bl.action}">${bl.action}${bl.gain_scale < 1 ? ' ' + bl.gain_scale.toFixed(2) : ''}</span></td>
      <td><button data-solo="${i}" class="${state.solo_index === i ? 'active' : ''}">独听</button></td>`;
    tbody.appendChild(tr);

    tr.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', async () => {
        const k = inp.dataset.k;
        let v = (k === 'decay' && inp.value.trim().toLowerCase() === 'inf') ? 'inf' : parseFloat(inp.value);
        try {
          state = await api('/api/partial', {index:i, changes:{[k]: v}});
          renderTable(); renderHeader();
        } catch (e) { setStatus(e.message, true); }
      });
    });
    tr.querySelector('[data-solo]').addEventListener('click', async () => {
      state = await api('/api/solo', {index: state.solo_index === i ? null : i});
      renderTable(); renderHeader();
    });
  });
}

function renderHeader() {
  const c = state.config;
  $('meta').textContent = `${c.name} · f0=${c.base_frequency} Hz · sr=${c.sample_rate} · ${c.partials.length} 个分音`;
  $('master').value = c.master_amplitude; $('masterVal').textContent = c.master_amplitude.toFixed(2);
  $('transition').value = c.transition_time; $('transitionVal').textContent = c.transition_time.toFixed(3) + ' s';
  $('bandlimitMode').value = c.bandlimit_mode;
  $('soloClear').className = state.solo_index === null ? 'active' : '';
}

async function refresh() {
  state = await api('/api/state');
  renderTable(); renderHeader();
}

function drawCanvas(canvas, values, sr, maxSeconds) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const n = Math.min(values.length, Math.floor(maxSeconds * sr));
  const peak = Math.max(...values.slice(0, n).map(Math.abs), 1e-9);
  ctx.strokeStyle = '#5aa7ff'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = (i / n) * w, y = h / 2 - (values[i] / peak) * (h / 2 - 6);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawSpectrum(peaks) {
  const canvas = $('spectrum');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const audible = peaks.filter(p => p.frequency < state.config.sample_rate / 2);
  const maxAmp = Math.max(...audible.map(p => p.amplitude), 1e-9);
  const maxF = Math.max(...audible.map(p => p.frequency), 1) * 1.1;
  ctx.fillStyle = '#5aa7ff';
  audible.forEach(p => {
    const x = (p.frequency / maxF) * w, bh = (p.amplitude / maxAmp) * (h - 24);
    ctx.fillRect(x - 3, h - bh, 6, bh);
    ctx.fillStyle = '#8b95a1'; ctx.font = '10px sans-serif';
    ctx.fillText(p.frequency.toFixed(0), x - 12, h - 8);
    ctx.fillStyle = '#5aa7ff';
  });
}

function playPCM(samples, sr) {
  if (liveSource) { try { liveSource.stop(); } catch (_) {} }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const buf = audioCtx.createBuffer(1, samples.length, sr);
  buf.copyToChannel(Float32Array.from(samples), 0);
  liveSource = audioCtx.createBufferSource();
  liveSource.buffer = buf; liveSource.connect(audioCtx.destination);
  liveSource.start();
}

async function doRender(autoplay) {
  setStatus('渲染中…');
  const data = await api('/api/render', {duration: parseFloat($('duration').value), block_size: 256});
  drawCanvas($('wave'), data.samples, data.sample_rate, 0.05);
  drawSpectrum(data.peaks);
  const tb = $('measureTable').querySelector('tbody'); tb.innerHTML = '';
  state.config.partials.forEach((p, i) => {
    const pk = data.peaks[i];
    const target = p.ratio * state.config.base_frequency;
    const ok = Math.abs(pk.frequency - target) <= 3 && pk.amplitude > 1e-4;
    tb.innerHTML += `<tr><td>${i}</td><td>${target.toFixed(2)}</td><td>${pk.frequency.toFixed(2)}</td>
      <td>${pk.amplitude.toFixed(5)}</td><td>${pk.phase.toFixed(3)}</td>
      <td class="${ok ? 'ok' : 'fail'}">${ok ? '参与输出' : '无能量'}</td></tr>`;
  });
  if (autoplay) playPCM(data.samples, data.sample_rate);
  setStatus(`已渲染 ${data.samples.length} 个采样${state.solo_index !== null ? '（独听分音 ' + state.solo_index + '）' : '（整体）'}`);
  return data;
}

// --- events ---
$('master').addEventListener('change', async e => {
  state = await api('/api/master', {master: parseFloat(e.target.value)}); renderHeader();
});
$('transition').addEventListener('change', async e => {
  state = await api('/api/master', {transition: parseFloat(e.target.value)}); renderHeader();
});
$('bandlimitMode').addEventListener('change', async e => {
  state = await api('/api/master', {bandlimit_mode: e.target.value});
  renderTable(); renderHeader();
});
$('soloClear').addEventListener('click', async () => {
  state = await api('/api/solo', {index: null}); renderTable(); renderHeader();
});
$('noteOn').addEventListener('click', async () => {
  const data = await api('/api/note/on', {freq_multiplier: parseFloat($('mult').value)});
  setStatus('音符实例 ' + data.note_id + ' 已启动（实时监听请用渲染播放）');
});
$('noteOff').addEventListener('click', async () => { await api('/api/note/off', {}); setStatus('已释放全部音符'); });
$('render').addEventListener('click', () => doRender(true).catch(e => setStatus(e.message, true)));
$('exportWav').addEventListener('click', async () => {
  const data = await doRender(false);
  const buf = new ArrayBuffer(44 + data.samples.length * 4);
  const dv = new DataView(buf);
  const writeStr = (off, s) => { for (let i=0;i<s.length;i++) dv.setUint8(off+i, s.charCodeAt(i)); };
  const dataSize = data.samples.length * 4;
  writeStr(0,'RIFF'); dv.setUint32(4, 36+dataSize,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,3,true); dv.setUint16(22,1,true);
  dv.setUint32(24,data.sample_rate,true); dv.setUint32(28,data.sample_rate*4,true);
  dv.setUint16(32,4,true); dv.setUint16(34,32,true);
  writeStr(36,'data'); dv.setUint32(40,dataSize,true);
  data.samples.forEach((v,i) => dv.setFloat32(44+i*4, Math.max(-1,Math.min(1,v)), true));
  const blob = new Blob([buf], {type:'audio/wav'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'additive-render.wav'; a.click();
  setStatus('已导出 32-bit float WAV');
});
$('saveConfig').addEventListener('click', async () => {
  const cfg = await api('/api/save', {});
  const blob = new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = cfg.name + '.json'; a.click();
});
$('loadFile').addEventListener('change', async e => {
  const text = await e.target.files[0].text();
  try {
    state = await api('/api/load', {config: JSON.parse(text)});
    renderTable(); renderHeader(); setStatus('配置已加载');
  } catch (err) { setStatus(err.message, true); }
});
refresh().catch(e => setStatus(e.message, true));
</script>
</body>
</html>
